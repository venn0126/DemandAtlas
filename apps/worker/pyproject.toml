[project]
name = "demand-atlas-worker"
version = "0.1.0"
description = "Demand Atlas worker service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dramatiq[redis]>=1.17.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "redis>=5.0.0",
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
