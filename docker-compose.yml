services:
  postgres:
    image: postgres:16
    container_name: demandatlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: demand_atlas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - demandatlas_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: demandatlas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: demandatlas-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - demandatlas_minio_data:/data

volumes:
  demandatlas_postgres_data:
  demandatlas_minio_data:
